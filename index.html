<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>限時免費領取 TRON (TRX)</title>
    <style>
        :root {
            --bg-main: #0c081e;
            --card-bg: rgba(26, 17, 54, 0.9);
            --gold-primary: #ffd15c;
            --gold-glow: #e6a817;
            --purple-accent: #9d4edd;
            --text-main: #f3f0ff;
            --text-muted: #a39bb8;
            --success-color: #00e676;
            --error-color: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #25134d 0%, var(--bg-main) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .claim-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 209, 92, 0.3);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7),
                        0 0 25px rgba(123, 44, 191, 0.35);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .badge {
            display: inline-block;
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid rgba(0, 230, 118, 0.4);
            color: var(--success-color);
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(180deg, #ffffff 20%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .sub-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .airdrop-box {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(157, 78, 221, 0.12) 100%);
            border: 1px dashed var(--gold-primary);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 22px;
        }

        .airdrop-amount {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold-primary);
            margin-bottom: 4px;
        }

        .airdrop-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gold-primary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(12, 8, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }
